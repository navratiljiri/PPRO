services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ppro_app
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "8000:80"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=ppro_db
      - DB_USERNAME=ppro_user
      - DB_PASSWORD=ppro_secret
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: ppro_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ppro_db
      MYSQL_USER: ppro_user
      MYSQL_PASSWORD: ppro_secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
    driver: local
